name: Test Python application

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    types: [ "checks_requested" ]
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  run-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
        cache: "pip"
    - name: Install app dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --only-binary :all: --ignore-installed --dry-run --quiet --report - openai ragas | python -c "import sys;import json;a=json.loads(sys.stdin.read());print('\\n'.join(f\"{o['metadata']['name']} == {o['metadata']['version']} \\\\\\n--hash=sha256:{o['download_info']['archive_info']['hashes']['sha256']}\" for o in a['install']))"
